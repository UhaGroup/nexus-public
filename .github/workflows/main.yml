name: Build Nexus Repository (Full Version)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Yarn Classic from Ubuntu repo
      run: |
        sudo apt-get update
        sudo apt-get install -y yarn

    - name: Install Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install project dependencies with Yarn
      run: |
        yarn install --frozen-lockfile

    - name: Build with Maven
      run: |
        ./mvnw clean install -Ppublic -DskipTests

    - name: Upload build artifact (JAR file)
      uses: actions/upload-artifact@v4
      with:
        name: nexus-repository-full
        path: public/selfhosted/assemblies/nexus-repository-core/target/assembly/
